{% extends 'base.html' %}
{% block title %}Triangle area{% endblock %}
{% block content %}
<div class="card">
  <h2>Area of a triangle</h2>
  <p>Area = ½ × base × height</p>
  <form method="post">
    <input name="base" type="number" step="any" min="0" placeholder="Base" required>
    <input name="height" type="number" step="any" min="0" placeholder="Height" required>
    <button>Calculate</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if result is not none %}<div class="result">Area: {{ result }}</div>{% endif %}
</div>
{% endblock %}
